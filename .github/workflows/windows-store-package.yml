name: Microsoft Store AppX candidate

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Exact Package/Identity/Name from CausalPilot Partner Center identity
        required: true
        type: string
      publisher:
        description: Exact Package/Identity/Publisher from CausalPilot Partner Center identity
        required: true
        type: string
      publisher_display_name:
        description: Exact PublisherDisplayName from Partner Center
        required: true
        default: LAI ZEYU
        type: string
      display_name:
        description: Reserved Microsoft Store display name
        required: true
        default: CausalPilot AI by LAI ZEYU
        type: string
      package_version:
        description: Four-part Store package version with final segment zero
        required: true
        default: 1.0.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-inspect-and-test:
    name: Build and inspect Store AppX
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CAUSALPILOT_PYTHON_EXECUTABLE: python
      CAUSALPILOT_APP_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\CausalPilot AI.exe
      CAUSALPILOT_LAUNCH_TIMEOUT_MS: "120000"
      CAUSALPILOT_STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      CAUSALPILOT_STORE_PUBLISHER: ${{ inputs.publisher }}
      CAUSALPILOT_STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      CAUSALPILOT_STORE_DISPLAY_NAME: ${{ inputs.display_name }}
      CAUSALPILOT_STORE_PACKAGE_VERSION: ${{ inputs.package_version }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r engine/requirements-build.txt
      - name: Validate source, engine, and fail-closed Store configuration
        run: |
          npm test
          npm run test:engine
          npm run check:windows-config
      - name: Build exact Store AppX candidate
        run: npm run package:win:store
      - name: Inspect packaged Windows PE architecture and security flags
        run: npm run check:windows-runtime
      - name: Exercise final native sidecar and packaged Windows workflow
        run: |
          npm run test:sidecar
          npm run qa:packaged
          npm run qa:windows-store-captures
      - name: Inspect identity, manifest, notices, secrets, and hash
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath release -Filter *.appx -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one AppX package, found $($packages.Count)."
          }
          ./scripts/inspect-store-appx.ps1 `
            -AppxPath $packages[0].FullName `
            -EvidenceDirectory "release/store-evidence"
      - name: Upload private Store candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CausalPilot-AI-0.1.0-microsoft-store-candidate
          path: |
            release/*.appx
            release/store-evidence/**
            release/windows-runtime-evidence/**
            design/qa/packaged-e2e-report.json
            design/qa/packaged-local-engine-result.png
            design/qa/windows-store/*.png
            design/qa/windows-store/windows-store-capture-report.json
          if-no-files-found: error
          retention-days: 30
